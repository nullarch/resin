name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # the README quick start, verbatim — the CLI must run straight from a clone
      - run: node bin/resin.mjs run examples/rsi-cross.pine --bars 300
      - run: node bin/resin.mjs check oracle/cases
