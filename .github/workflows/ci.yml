name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['22.18', '24']
        include:
          - os: macos-latest
            node: '24'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # the README quick start, verbatim — the CLI must run straight from a clone
      - run: node bin/resin.mjs run examples/rsi-cross.pine --bars 300
      - run: node bin/resin.mjs check oracle/cases
      # tests must not write into the tree
      - name: Working tree is clean after the tests
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the test run changed the working tree:"
            git status --porcelain
            exit 1
          fi

  package:
    name: package smoke (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # pack the repo, check the file list against scripts/package-files.allow and the size budget,
      # install the tarball into a fresh project, run the CLI and the library import from there
      - run: node scripts/package-smoke.mjs
      - name: Working tree is clean after the smoke test
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::package-smoke changed the working tree:"
            git status --porcelain
            exit 1
          fi
